name: Feature request
description: Propose something new, or a change to existing behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that the engine doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have one in mind — an API sketch is welcome, but not required.
    validations:
      required: false
