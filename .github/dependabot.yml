version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /examples/basic
    schedule:
      interval: weekly
    groups:
      # vite and @vitejs/plugin-react are peer-locked to each other — bumping
      # one without the other breaks npm's peer resolution (seen firsthand:
      # PRs #6-#9). Grouping all dev deps keeps such pairs moving together.
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /examples/with-models
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
