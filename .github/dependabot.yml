version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # three / react / @react-three/* are peer-locked to each other (fiber
      # caps react, drei pins fiber's major, @types/three tracks three) —
      # bumped one at a time they fail peer resolution. Listed before
      # dev-dependencies because Dependabot uses the first matching group.
      render-stack:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # @react-three/fiber@9.7.0's peer range caps react/react-dom at <19.3
      # for a real reason (19.3 changed a transition-object shape fiber
      # reads unguarded) — not just an unreviewed ceiling. Fix is in flight:
      # https://github.com/pmndrs/react-three-fiber/pull/3916. Remove this
      # once a released fiber version supports 19.3.
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      # TypeScript 7 (the native port) ships no JS compiler API, which the
      # toolchain still needs: tsup's dts build (rollup-plugin-dts) fails
      # outright, and the typescript-eslint 8.72 (<6.1), ts-jest 29.4
      # (<7) and typedoc 0.28 (<=6.0) peer ranges all exclude it. Remove
      # this once those support TS 7 (or ship a TS 7 API fallback).
      # TS 6 is still offered: the same toolchain accepts it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: npm
    directory: /examples/basic
    schedule:
      interval: weekly
    groups:
      render-stack: # same peer-locked set as the root entry — see there
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vite and @vitejs/plugin-react are peer-locked to each other — bumping
      # one without the other breaks npm's peer resolution (seen firsthand:
      # PRs #6-#9). Grouping all dev deps keeps such pairs moving together.
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /examples/with-models
    schedule:
      interval: weekly
    groups:
      render-stack: # same peer-locked set as the root entry — see there
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  # Offline asset-rebuild scripts (not installed by the example or CI), but
  # their lockfile still pulls in native code (sharp) worth keeping patched.
  - package-ecosystem: npm
    directory: /examples/with-models/asset-tools
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
