name: Deploy example and docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Builds the root package's dist/ — examples/basic depends on it via
      # `file:../..`, so it has to exist before the example's own install
      # (which runs the package's `prepare` script) can succeed.
      - run: npm ci
      - run: npm run build
      - run: npm run docs
      - run: npm ci
        working-directory: examples/basic
      - run: npm run build
        working-directory: examples/basic
        env:
          GITHUB_PAGES: "true"
      - run: npm ci
        working-directory: examples/with-models
      - run: npm run build
        working-directory: examples/with-models
        env:
          GITHUB_PAGES: "true"
      # One Pages site, several things in it: the basic example app at the
      # root, the real-NASA-assets example under /with-models/ (its own
      # vite base is already set to that subpath — see its vite.config.ts),
      # and the generated API reference under /docs/.
      - run: cp -r docs-site examples/basic/dist/docs
      - run: cp -r examples/with-models/dist examples/basic/dist/with-models
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/basic/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
