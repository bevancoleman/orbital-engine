name: Deploy example and docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Builds the root package's dist/ — examples/basic depends on it via
      # `file:../..`, so it has to exist before the example builds.
      # --ignore-scripts everywhere: no dependency lifecycle scripts run
      # while this workflow holds pages/id-token write, and the root's
      # `prepare` doesn't redo the explicit build below.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run docs
      - run: npm ci --ignore-scripts
        working-directory: examples/basic
      - run: npm run build
        working-directory: examples/basic
        env:
          GITHUB_PAGES: "true"
      - run: npm ci --ignore-scripts
        working-directory: examples/with-models
      - run: npm run build
        working-directory: examples/with-models
        env:
          GITHUB_PAGES: "true"
      # One Pages site, several things in it: the basic example app at the
      # root, the real-NASA-assets example under /with-models/ (its own
      # vite base is already set to that subpath — see its vite.config.ts),
      # and the generated API reference under /docs/.
      - run: cp -r docs-site examples/basic/dist/docs
      - run: cp -r examples/with-models/dist examples/basic/dist/with-models
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/basic/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
